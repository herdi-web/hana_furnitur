<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Hana Furnitur</title>
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- bootstrap icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <!-- css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- navbar start -->
    <nav
      class="navbar navbar-expand-md"
      style="border-bottom: 2px solid var(--border-default)"
    >
      <div class="container-fluid p-2 mx-2">
        <a class="navbar-brand fs-4 fw-bold" href="#">
          <i
            class="bi bi-house-door mx-2 p-2"
            style="
              background-color: var(--brand-oak);
              color: var(--bg-base);
              border-radius: 12px;
            "
          ></i
          >Hanara</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav mx-auto">
            <a class="nav-link active" aria-current="page" href="#hero">Home</a>
            <a class="nav-link" href="#products">Koleksi</a>
            <a class="nav-link" href="#about">Tentang</a>
            <a class="nav-link" href="#cta">Kontak</a>
          </div>
          <a
            class="btn btn-primary float-end py-2"
            style="
              background-color: var(--brand-oak);
              border: none;
              border-radius: 24px;
            "
            href="#"
            >Hubungi Kami</a
          >
        </div>
      </div>
    </nav>
    <!-- navbar start -->

    <!-- hero start -->
    <section id="hero">
      <div class="container">
        <div class="row my-5 align-items-center">
          <div class="col-12 col-md-6">
            <span
              class="badge fw-normal rounded-pill d-inline-flex align-items-center gap-1 py-2 text-uppercase"
              style="
                background-color: var(--brand-sage-soft);
                color: var(--text-primary);
                font-size: 0.7rem;
                letter-spacing: 0.05em;
              "
            >
              <span
                class="d-inline-block rounded-circle mx-1"
                style="
                  width: 7px;
                  height: 7px;
                  background-color: var(--brand-oak);
                "
              ></span>
              koleksi terbaru 2026
            </span>
            <h1 class="fw-bold my-4">
              Furnitur hangat untuk rumah yang lebih tenang.
            </h1>
            <p
              class="fw-light"
              style="color: var(--text-secondary); max-width: 28rem"
            >
              Desain bersih, material pilihan, dan pengerjaan rapi. Temukan
              sofa, meja, dan lemari yang membuat setiap ruang terasa nyaman.
            </p>
            <a
              class="btn rounded-pill py-2"
              style="
                background-color: var(--brand-oak);
                color: var(--text-inverse);
                font-size: 0.8rem;
                width: 7rem;
                height: 2.5rem;
              "
              href="#"
              type="button"
              >Lihat Koleksi</a
            >
            <a
              class="btn rounded-pill py-2"
              style="
                background-color: var(--surface-card);
                color: var(--text-primary);
                font-size: 0.8rem;
                width: 9rem;
                height: 2.5rem;
              "
              href="#"
              type="button"
              >Konsultasi</a
            >
          </div>
          <div class="col-12 col-md-6">
            <img
              class="img-fluid d-block ms-md-auto w-100 my-4"
              style="max-width: 30rem"
              src="img/hero.png"
              alt="hero image"
            />
          </div>
        </div>
      </div>
    </section>
    <!-- hero end -->

    <!-- categories start -->
    <section id="categories"></section>
    <!-- categories start -->

    <!-- product start -->
    <section id="products"></section>
    <!-- product end -->

    <!-- service start -->
    <section id="service"></section>
    <!-- service end -->

    <!-- about start -->
    <section id="about"></section>
    <!-- about start -->

    <!-- cta start -->
    <section id="cta"></section>
    <!-- cta start -->

    <!-- footer start -->
    <footer></footer>
    <!-- footer end -->

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
